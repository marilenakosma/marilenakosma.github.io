  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!--
    Load Montserrat as non-render-blocking:
    media="print" means the browser fetches it at low priority without blocking render.
    onload switches it to media="all" once it's downloaded.
    <noscript> provides a fallback for users with JS disabled.
  -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" />
  </noscript>
</head>
